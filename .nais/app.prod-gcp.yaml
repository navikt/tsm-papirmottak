spec:
  port: 8080
  replicas:
    min: 2
    max: 6
  kafka:
    pool: nav-prod
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: tsm-pdl-cache
      external:
        - host: saf.prod-fss-pub.nais.io
  env:
    - name: SAF_ENDPOINT
      value: https://saf.prod-fss-pub.nais.io
