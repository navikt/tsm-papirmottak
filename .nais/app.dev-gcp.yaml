spec:
  port: 8080
  replicas:
    min: 1
    max: 2
  kafka:
    pool: nav-dev
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: tsm-pdl-cache
      external:
        - host: saf-q2.dev-fss-pub.nais.io
  env:
    - name: SAF_ENDPOINT
      value: https://saf-q2.dev-fss-pub.nais.io
